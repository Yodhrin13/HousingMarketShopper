name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $json = Get-Content "HousingMarketShopper.json" | ConvertFrom-Json
          echo "version=$($json.AssemblyVersion)" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        run: |
          $out = "bin/Release/net10.0-windows"
          Compress-Archive `
            -Path "$out/HousingMarketShopper.dll", "HousingMarketShopper.json" `
            -DestinationPath "latest.zip"

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          files: latest.zip
          body: "Automated build — v${{ steps.version.outputs.version }}"

      - name: Update pluginmaster.json
        shell: pwsh
        run: |
          $pm = Get-Content "pluginmaster.json" | ConvertFrom-Json
          $pm[0].AssemblyVersion        = "${{ steps.version.outputs.version }}"
          $pm[0].TestingAssemblyVersion = "${{ steps.version.outputs.version }}"
          $pm[0].LastUpdated = [System.DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $pm | ConvertTo-Json -Depth 10 | Out-File "pluginmaster.json" -Encoding utf8NoBOM

      - name: Commit pluginmaster.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git diff --staged --quiet || git commit -m "ci: update pluginmaster.json [skip ci]"
          git push
