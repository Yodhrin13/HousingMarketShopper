name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-

      - name: Extract version
        id: version
        shell: bash
        run: |
          ASSEMBLY=$(python -c "import json; print(json.load(open('HousingMarketShopper.json'))['AssemblyVersion'])")
          echo "assembly=$ASSEMBLY" >> $GITHUB_OUTPUT
          TAG="v$(echo $ASSEMBLY | sed 's/\.0$//')"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Version: $ASSEMBLY  Tag: $TAG"

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build --configuration Release --nologo

      - name: Verify build artifact
        shell: bash
        run: |
          ZIP="bin/Release/HousingMarketShopper/latest.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: expected zip not found at $ZIP"
            echo "Zips found:"
            find bin -name "*.zip" 2>/dev/null
            exit 1
          fi
          echo "Found: $ZIP"

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" --repo Yodhrin13/HousingMarketShopper > /dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
          else
            gh release create "$TAG" \
              bin/Release/HousingMarketShopper/latest.zip \
              --repo Yodhrin13/HousingMarketShopper \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Update pluginmaster.json
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.assembly }}"
          TIMESTAMP=$(date +%s)
          jq --arg v "$VERSION" --argjson t "$TIMESTAMP" \
            '.[0].AssemblyVersion = $v | .[0].TestingAssemblyVersion = $v | .[0].LastUpdated = $t' \
            pluginmaster.json > updated.json && mv updated.json pluginmaster.json

      - name: Commit pluginmaster.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git diff --staged --quiet || git commit -m "ci: bump pluginmaster.json to ${{ steps.version.outputs.tag }} [skip ci]"
          git push
